user www-data;
worker_processes 1;
pid /mnt/kindom_rush_like/run/nginx.pid;
error_log /mnt/kindom_rush_like/logs/error.log warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    access_log /mnt/kindom_rush_like/logs/access.log;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_body_temp_path /mnt/kindom_rush_like/run/client_temp;
    proxy_temp_path /mnt/kindom_rush_like/run/proxy_temp;
    fastcgi_temp_path /mnt/kindom_rush_like/run/fastcgi_temp;
    uwsgi_temp_path /mnt/kindom_rush_like/run/uwsgi_temp;
    scgi_temp_path /mnt/kindom_rush_like/run/scgi_temp;

    server {
        listen 5173;
        server_name _;
        root /mnt/kindom_rush_like/current;
        index index.html;

        location = /healthz {
            default_type text/plain;
            return 200 "verdant-guard ok\n";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache";
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /voices/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600";
        }

        location ~ /\. {
            deny all;
        }
    }
}
